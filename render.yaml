# Render Blueprint: New > Blueprint > pick this repo. Fill the three NEO4J_* values when asked.
# The disk keeps workspaces, saved keys and investigations across deploys (a disk needs a paid instance).
services:
  - type: web
    name: hackfront-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    numInstances: 1  # sync jobs are tracked in-process: keep exactly one instance
    disk:
      name: hackfront-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HACKFRONT_ACCESS_TOKEN
        generateValue: true  # copy it into Vercel as HACKFRONT_API_TOKEN
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
