# neo4j: dev/demo graph (bolt 7688). neo4j-test: throwaway DB the test suite wipes freely (bolt 7689).
# Ports differ from the default 7687 so they never collide with another local Neo4j.
services:
  neo4j:
    image: neo4j:5
    ports: ["7688:7687", "7475:7474"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-hackfront-dev}
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-hackfront-dev}' 'RETURN 1' >/dev/null"]
      interval: 3s
      retries: 30
  neo4j-test:
    image: neo4j:5
    ports: ["7689:7687"]
    environment:
      NEO4J_AUTH: neo4j/hackfront-test
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p hackfront-test 'RETURN 1' >/dev/null"]
      interval: 3s
      retries: 30
volumes:
  neo4j-data:
