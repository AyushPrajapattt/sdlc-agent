[project]
name = "hackfront"
version = "0.1.0"
description = "Engineering memory: an evidence graph over GitHub, Jira and Slack, and an agent that answers 'why' from it."
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.28",
    "langgraph>=0.2",
    "openai>=1.50",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=43",  # Fernet: encrypts saved API keys at rest when state lives in Neo4j
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
hackfront = "hackfront.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackfront"]

[tool.pytest.ini_options]
testpaths = ["tests"]
